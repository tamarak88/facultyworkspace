    // ============================================================
    // EVENT HANDLERS
    // ============================================================
    function attachEventListeners() {
        // License form
        const licenseForm = document.getElementById('license-form');
        if (licenseForm) {
            const typeRadios = document.querySelectorAll('input[name="license-type"]');
            const yearSelector = document.getElementById('year-selector');
            const licenseYear = document.getElementById('license-year');

            // Populate year selector
            const currentYear = new Date().getFullYear();
            for (let i = 0; i <= 5; i++) {
                const year = currentYear + i;
                const option = document.createElement('option');
                option.value = year;
                option.textContent = `${year} (expires Aug 31)`;
                licenseYear.appendChild(option);
            }

            typeRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    if (radio.value === 'annual') {
                        yearSelector.classList.add('visible');
                        licenseYear.required = true;
                    } else {
                        yearSelector.classList.remove('visible');
                        licenseYear.required = false;
                    }
                });
            });

            licenseForm.addEventListener('submit', (e) => {
                e.preventDefault();
                handleLicenseActivation();
            });

            // Also attach directly to button in case form submit is blocked
            const activateBtn = document.getElementById('activate-btn');
            if (activateBtn) {
                activateBtn.addEventListener('click', () => {
                    handleLicenseActivation();
                });
            }

            // How It Works toggle on license screen
            const licenseHowToggle = document.getElementById('license-how-toggle');
            if (licenseHowToggle) {
                licenseHowToggle.addEventListener('click', () => {
                    licenseHowToggle.classList.toggle('open');
                    document.getElementById('license-how-panel').classList.toggle('open');
                });
            }
        }

        // Landing page navigation
        const goToActivate = document.getElementById('go-to-activate');
        if (goToActivate) {
            goToActivate.addEventListener('click', (e) => {
                e.preventDefault();
                state.showSignUp = true;
                render();
            });
        }

        // Sign Up → Back to landing
        const backToLanding = document.getElementById('back-to-landing');
        if (backToLanding) {
            backToLanding.addEventListener('click', (e) => {
                e.preventDefault();
                state.showSignUp = false;
                render();
            });
        }

        // How It Works toggle on landing page (outside license form)
        if (!document.getElementById('license-form')) {
            const landingHowToggle = document.getElementById('license-how-toggle');
            if (landingHowToggle) {
                landingHowToggle.addEventListener('click', () => {
                    landingHowToggle.classList.toggle('open');
                    document.getElementById('license-how-panel').classList.toggle('open');
                });
            }
        }

        // Upload area
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        if (uploadArea && fileInput) {
            uploadArea.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('dragover', e => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });
            uploadArea.addEventListener('drop', e => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file && file.type === 'application/pdf') handleFileUpload(file);
            });
            fileInput.addEventListener('change', e => {
                const file = e.target.files[0];
                if (file) handleFileUpload(file);
            });
        }

        // Individual photo upload (upload screen)
        const photoArea = document.getElementById('photo-upload-area');
        const photoInput = document.getElementById('photo-input');
        if (photoArea && photoInput) {
            photoArea.addEventListener('click', () => photoInput.click());
            photoArea.addEventListener('dragover', e => { e.preventDefault(); photoArea.classList.add('dragover'); });
            photoArea.addEventListener('dragleave', () => photoArea.classList.remove('dragover'));
            photoArea.addEventListener('drop', e => {
                e.preventDefault();
                photoArea.classList.remove('dragover');
                handlePhotoFiles(e.dataTransfer.files, false);
            });
            photoInput.addEventListener('change', e => handlePhotoFiles(e.target.files, false));
        }

        // Add more photos (review screen)
        const addCard = document.getElementById('add-photo-card');
        const addInput = document.getElementById('add-photo-input');
        if (addCard && addInput) {
            addCard.addEventListener('click', () => addInput.click());
            addCard.addEventListener('dragover', e => { e.preventDefault(); addCard.classList.add('dragover'); });
            addCard.addEventListener('dragleave', () => addCard.classList.remove('dragover'));
            addCard.addEventListener('drop', e => {
                e.preventDefault();
                addCard.classList.remove('dragover');
                handlePhotoFiles(e.dataTransfer.files, true);
            });
            addInput.addEventListener('change', e => handlePhotoFiles(e.target.files, true));
        }

        // Replace a single student's photo (review screen)
        const replaceInput = document.getElementById('replace-photo-input');
        if (replaceInput) {
            document.querySelectorAll('.review-card .photo-wrap').forEach(el => {
                el.addEventListener('click', () => {
                    replaceInput.dataset.idx = el.dataset.idx;
                    replaceInput.value = '';
                    replaceInput.click();
                });
            });
            replaceInput.addEventListener('change', async e => {
                const file = e.target.files[0];
                const idx = parseInt(replaceInput.dataset.idx);
                if (!file || isNaN(idx) || !state.students[idx]) return;
                try {
                    state.students[idx].imageDataUrl = await imageFileToDataUrl(file);
                    render();
                } catch (err) {
                    alert(`Couldn't read "${file.name}". Try saving it as a JPG or PNG first.`);
                }
            });
        }

        // Get started button
        const getStartedBtn = document.getElementById('get-started');
        if (getStartedBtn) {
            getStartedBtn.addEventListener('click', () => {
                state.screen = 'upload';
                render();
            });
        }

        // Instructions toggle
        const instrToggle = document.getElementById('instructions-toggle');
        if (instrToggle) {
            instrToggle.addEventListener('click', () => {
                instrToggle.classList.toggle('open');
                document.getElementById('instructions-panel').classList.toggle('open');
            });
        }

        // Resume buttons
        document.querySelectorAll('.resume-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const key = e.target.dataset.key;
                handleResume(key);
            });
        });

        // Add / Edit students in an existing class
        document.querySelectorAll('#edit-class').forEach(btn => {
            btn.addEventListener('click', () => enterEditMode());
        });
        document.querySelectorAll('.edit-class-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (loadClass(e.target.dataset.key)) enterEditMode();
            });
        });
        const cancelEdit = document.getElementById('cancel-edit');
        if (cancelEdit) {
            cancelEdit.addEventListener('click', () => {
                state.editingClass = false;
                loadClass(state.classId);  // discard unsaved edits
                state.screen = 'dashboard';
                render();
            });
        }

        // Delete class buttons
        document.querySelectorAll('.delete-class-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const key = e.target.dataset.key;
                handleDeleteClass(key);
            });
        });

        // Back to welcome
        const backToWelcome = document.getElementById('back-to-welcome');
        if (backToWelcome) {
            backToWelcome.addEventListener('click', () => {
                state.screen = 'welcome';
                render();
            });
        }

        // Back to upload
        document.querySelectorAll('#back-to-upload').forEach(btn => {
            btn.addEventListener('click', () => {
                state.screen = 'welcome';
                state.className = '';
                state.detectedClassName = '';
                render();
            });
        });

        // Review screen - remove button
        document.querySelectorAll('.remove-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(e.target.dataset.idx);
                state.students.splice(idx, 1);
                render();
            });
        });

        // Name editing in review
        document.querySelectorAll('.review-card .name').forEach(el => {
            el.addEventListener('click', (e) => {
                const idx = parseInt(e.target.dataset.idx);
                const currentName = state.students[idx].name;
                el.innerHTML = `<input class="name-edit-input" value="${currentName}" data-idx="${idx}">`;
                const input = el.querySelector('input');
                input.focus();
                input.select();
                input.addEventListener('blur', () => {
                    const newName = input.value.trim();
                    if (newName) state.students[idx].name = newName;
                    render();
                });
                input.addEventListener('keydown', (ev) => {
                    if (ev.key === 'Enter') input.blur();
                    if (ev.key === 'Escape') { input.value = currentName; input.blur(); }
                });
            });
        });

        // Class name input
        const classNameInput = document.getElementById('class-name-input');
        if (classNameInput) {
            classNameInput.addEventListener('input', (e) => {
                state.className = e.target.value;
            });
        }

        // Gender toggle buttons
        document.querySelectorAll('.gender-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(e.target.dataset.idx);
                const gender = e.target.dataset.gender;
                state.students[idx].gender = gender;
                render();
            });
        });

        // Start quiz
        const startBtn = document.getElementById('start-quiz');
        if (startBtn) {
            startBtn.addEventListener('click', () => {
                const classNameInput = document.getElementById('class-name-input');
                if (classNameInput) {
                    state.className = classNameInput.value.trim();
                }
                if (state.editingClass) {
                    // Keep the same saved class (and everyone's progress).
                    state.editingClass = false;
                    saveProgress();
                    state.screen = 'dashboard';
                    render();
                    return;
                }
                state.classId = simpleHash(state.students.map(s => s.name).sort().join('|'));
                const saved = loadProgress(state.classId);
                if (saved) {
                    state.students = mergeProgress(state.students, saved);
                    if (!state.className && saved.className) {
                        state.className = saved.className;
                    }
                }
                saveProgress();
                state.screen = 'quiz';
                advanceToNextQuestion();
            });
        }

        // MC option click
        document.querySelectorAll('.mc-option').forEach(btn => {
            btn.addEventListener('click', () => {
                if (state.answeredThisRound) return;
                handleMCAnswer(btn.dataset.id);
            });
        });

        // Skip button
        const skipBtn = document.getElementById('skip-btn');
        if (skipBtn) {
            skipBtn.addEventListener('click', handleSkip);
        }

        // FR submit
        const frSubmit = document.getElementById('fr-submit');
        const frInput = document.getElementById('fr-input');
        if (frSubmit && frInput) {
            frSubmit.addEventListener('click', () => handleFRAnswer(frInput.value));
            frInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleFRAnswer(frInput.value);
            });
        }

        // Promote button
        const promoteBtn = document.getElementById('promote-btn');
        if (promoteBtn) {
            promoteBtn.addEventListener('click', () => {
                clearTimeout(nextQuestionTimer);
                const studentId = promoteBtn.dataset.studentId;
                const student = state.students.find(s => s.id === studentId);
                if (!student) return;
                if (student.status === 'learning') {
                    student.status = 'in_progress';
                    student.mcCorrect = CONFIG.MC_CORRECT_TO_ADVANCE;
                } else if (student.status === 'in_progress') {
                    student.status = 'mastered';
                    student.frCorrect = CONFIG.FR_CORRECT_TO_MASTER;
                }
                saveProgress();
                advanceToNextQuestion();
            });
        }

        // Correct name button
        const correctNameBtn = document.getElementById('correct-name-btn');
        if (correctNameBtn) {
            correctNameBtn.addEventListener('click', () => {
                showNameCorrectionModal();
            });
        }

        // Dashboard
        document.querySelectorAll('#show-dashboard').forEach(btn => {
            btn.addEventListener('click', () => {
                state.screen = 'dashboard';
                render();
            });
        });

        // Continue quiz
        document.querySelectorAll('#continue-quiz').forEach(btn => {
            btn.addEventListener('click', () => {
                state.screen = 'quiz';
                advanceToNextQuestion();
            });
        });

        // Reset progress
        const resetBtn = document.getElementById('reset-progress');
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                if (confirm('Reset all progress? This cannot be undone.')) {
                    state.students.forEach(s => {
                        s.status = 'learning';
                        s.mcCorrect = 0;
                        s.frCorrect = 0;
                        s.totalAttempts = 0;
                        s.lastSeen = 0;
                    });
                    saveProgress();
                    render();
                }
            });
        }
    }

    // ============================================================
    // LICENSE FUNCTIONS
    // ============================================================
    function handleLicenseActivation() {
        const messageEl = document.getElementById('license-message');
        try {
            const name = document.getElementById('license-name').value.trim();
            const key = document.getElementById('license-key').value.trim().toUpperCase();
            const typeRadios = document.querySelectorAll('input[name="license-type"]');
            let type = 'annual';
            for (const radio of typeRadios) {
                if (radio.checked) {
                    type = radio.value;
                    break;
                }
            }

            if (!name) {
                messageEl.innerHTML = '<div class="license-error">Please enter your licensed name.</div>';
                return;
            }

            if (!key) {
                messageEl.innerHTML = '<div class="license-error">Please enter your license key.</div>';
                return;
            }

            let year = new Date().getFullYear();
            if (type === 'annual') {
                const yearSelect = document.getElementById('license-year');
                year = parseInt(yearSelect.value);
            }

            // Validate the license key
            const validation = validateLicenseKey(name, key, type, year);

            if (!validation.valid) {
                messageEl.innerHTML = `<div class="license-error">${validation.message}</div>`;
                return;
            }

            // Key is valid — save and proceed
            saveLicenseInfo(name, type, year, key);
            state.licenseInfo = { name, licenseType: type, year, key };

            messageEl.innerHTML = '<div class="license-success">License activated successfully!</div>';
            setTimeout(() => {
                state.screen = 'welcome';
                render();
            }, 1000);
        } catch (err) {
            messageEl.innerHTML = `<div class="license-error">Error: ${err.message}</div>`;
        }
    }

    function handleChangeLicense(e) {
        if (e) e.preventDefault();
        clearLicense();
        state.showSignUp = false;
        state.screen = 'welcome';
        render();
    }

    // ============================================================
    // NAME CORRECTION MODAL
    // ============================================================
    function showNameCorrectionModal() {
        const student = state.students.find(s => s.id === state.currentStudent.id);
        if (!student) return;

        state.modalOpen = true;

        const modal = document.createElement('div');
        modal.id = 'name-modal-overlay';
        modal.className = 'name-modal-overlay';
        modal.innerHTML = `
            <div class="name-modal">
                <h3>Correct Student Name</h3>
                <p>Update the name for this student (e.g., use a nickname or fix a spelling error).</p>
                <input type="text" id="name-modal-input" class="name-modal-input" value="${student.name}" autocomplete="off" spellcheck="false">
                <div class="name-modal-buttons">
                    <button class="btn btn-outline btn-sm" id="name-modal-cancel">Cancel</button>
                    <button class="btn btn-primary btn-sm" id="name-modal-save">Save</button>
                </div>
            </div>`;
        document.body.appendChild(modal);

        const input = document.getElementById('name-modal-input');
        if (input) { input.focus(); input.select(); }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeNameModal();
        });
        document.getElementById('name-modal-cancel').addEventListener('click', closeNameModal);
        document.getElementById('name-modal-save').addEventListener('click', () => {
            saveNameCorrection(document.getElementById('name-modal-input').value);
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveNameCorrection(input.value);
            if (e.key === 'Escape') closeNameModal();
        });
    }

    function closeNameModal() {
        const overlay = document.getElementById('name-modal-overlay');
        if (overlay) overlay.remove();
        state.modalOpen = false;
    }

    function saveNameCorrection(newName) {
        newName = newName.trim();
        if (!newName) return;

        const student = state.students.find(s => s.id === state.currentStudent.id);
        if (student) {
            student.name = newName;
            // Only re-guess gender if no pronouns were extracted from the roster
            if (!student.pronouns) {
                student.gender = guessGender(newName);
            }
            saveProgress();
        }
        closeNameModal();

        if (state.feedback && !state.feedback.correct) {
            state.feedback.message = state.feedback.message.replace(state.currentStudent.name, newName);
        }
        state.currentStudent.name = newName;
        render();
    }

    // ============================================================
    // FILE HANDLING
    // ============================================================
    async function handleFileUpload(file) {
        state.uploadSource = 'pdf';
        state.editingClass = false;
        state.screen = 'processing';
        state.processingMessage = 'Loading PDF...';
        state.error = null;
        render();

        try {
            const students = await processPDF(file);
            if (students.length === 0) {
                state.error = 'No students could be extracted from this PDF.';
            }
            state.students = students;
            state.screen = 'review';
        } catch (err) {
            console.error('PDF processing error:', err);
            state.error = err.message || 'Failed to process PDF';
            state.screen = 'review';
            state.students = [];
        }
        render();
    }

    // ============================================================
    // INDIVIDUAL PHOTO UPLOAD
    // ============================================================
    // Turns a file name like "smith_jane-2.jpg" or "Jane Smith.png" into a
    // readable default name. The user can edit it on the review screen.
    function nameFromFilename(fileName) {
        let n = fileName.replace(/\.[^.]+$/, '')      // extension
                        .replace(/[_\-.]+/g, ' ')       // separators
                        .replace(/\(\d+\)|\b\d+\b/g, ' ') // copy numbers / IDs
                        .replace(/\s+/g, ' ').trim();
        if (!n || /^(img|image|photo|dsc|pxl|screenshot)\b/i.test(n)) return 'New Student';
        // "Smith, Jane" -> "Jane Smith"
        if (/,/.test(fileName) && n.split(' ').length >= 2) {
            const parts = fileName.replace(/\.[^.]+$/, '').split(',');
            if (parts.length === 2) n = (parts[1].trim() + ' ' + parts[0].trim()).replace(/[_\-]+/g, ' ');
        }
        return n.split(' ').map(w =>
            w === w.toLowerCase() || w === w.toUpperCase() ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : w
        ).join(' ');
    }

    // Loads an image file and shrinks it so a whole class fits in browser storage.
    function imageFileToDataUrl(file, maxSide = 400) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
                const w = Math.max(1, Math.round(img.naturalWidth * scale));
                const h = Math.max(1, Math.round(img.naturalHeight * scale));
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0, w, h);
                URL.revokeObjectURL(url);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Unreadable image')); };
            img.src = url;
        });
    }

    async function handlePhotoFiles(fileList, append) {
        const files = Array.from(fileList || []).filter(f =>
            (f.type && f.type.startsWith('image/')) || /\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(f.name));
        if (files.length === 0) return;

        const existing = append ? state.students : [];
        if (!append) {
            state.className = '';
            state.detectedClassName = '';
            state.uploadSource = 'photos';
            state.editingClass = false;
        }
        state.screen = 'processing';
        state.error = null;

        const added = [];
        const failed = [];
        for (let i = 0; i < files.length; i++) {
            state.processingMessage = `Loading photo ${i + 1} of ${files.length}...`;
            render();
            try {
                const imageDataUrl = await imageFileToDataUrl(files[i]);
                const name = nameFromFilename(files[i].name);
                added.push({
                    id: Math.random().toString(36).substring(2, 9),
                    name,
                    pronouns: null,
                    gender: guessGender(name),
                    imageDataUrl,
                    status: 'learning',
                    mcCorrect: 0,
                    frCorrect: 0,
                    totalAttempts: 0,
                    lastSeen: 0,
                });
            } catch (err) {
                failed.push(files[i].name);
            }
        }

        state.students = existing.concat(added);
        state.screen = 'review';
        render();
        if (failed.length) {
            alert(`Couldn't read ${failed.length} photo${failed.length > 1 ? 's' : ''}: ${failed.join(', ')}\n\n` +
                  `Try saving ${failed.length > 1 ? 'them' : 'it'} as JPG or PNG first.`);
        }
    }

    function loadClass(key) {
        const saved = loadProgress(key);
        if (!saved || !saved.students) return false;
        state.students = saved.students.map(s => ({
            ...s,
            pronouns: s.pronouns || null,
            gender: s.gender || guessGender(s.name),
        }));
        state.classId = key;
        state.className = saved.className || '';
        return true;
    }

    function enterEditMode() {
        if (!state.classId) return;
        state.editingClass = true;
        state.students = state.students.map(s => ({ ...s }));
        state.screen = 'review';
        render();
    }

    function handleResume(key) {
        state.editingClass = false;
        const saved = loadProgress(key);
        if (saved && saved.students) {
            state.students = saved.students.map(s => ({
                ...s,
                pronouns: s.pronouns || null,
                gender: s.gender || guessGender(s.name),
            }));
            state.classId = key;
            state.className = saved.className || '';
            state.screen = 'quiz';
            advanceToNextQuestion();
        }
    }

    function handleDeleteClass(key) {
        if (confirm('Delete this class and all its progress? This cannot be undone.')) {
            try { localStorage.removeItem(key); } catch {}
            render();
        }
    }

    function updateProcessing(msg) {
        state.processingMessage = msg;
        const pEl = document.querySelector('.processing p');
        if (pEl) pEl.textContent = msg;
    }

    // ============================================================
    // INITIALIZATION
    // ============================================================
    if (typeof pdfjsLib === 'undefined') {
        document.getElementById('app').innerHTML = `
            <div style="max-width:600px;margin:80px auto;text-align:center;">
                <div class="card">
                    <h2 style="color:var(--danger);margin-bottom:12px;">Failed to Load PDF Library</h2>
                    <p style="color:var(--text-light);">
                        Could not load PDF.js from CDN. Please check your internet connection and reload the page.
                    </p>
                    <button class="btn btn-primary" style="margin-top:16px;" onclick="location.reload()">Reload</button>
                </div>
            </div>`;
    } else {
        // Check for existing license
        const existingLicense = loadLicenseInfo();
        if (existingLicense) {
            state.licenseInfo = existingLicense;
        }

        state.screen = 'welcome';
        render();
    }
    </script>
